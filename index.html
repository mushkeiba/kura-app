<script>
/* PC・LINE外ブラウザは専用ページ pc.html へ（このページはLIFF=LINEアプリ内専用） */
(function(){try{if(!/Line\//.test(navigator.userAgent)){location.replace('pc.html');return;}}catch(e){}
/* キャッシュ対策：_cb が無ければ一意URLで読み直す＝常に最新を取得（GitHub Pagesでも効く） */
try{var u=new URL(location.href);if(!u.searchParams.has('_cb')){u.searchParams.set('_cb',String(Date.now()));location.replace(u.toString());}}catch(e){}})();
</script>
<title>KURA 予約</title>
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.4/dist/vuetify.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&display=swap">
<style>
  html,body{margin:0;font-family:"Noto Sans JP",sans-serif;}
  .v-application{font-family:"Noto Sans JP",sans-serif !important;}
  .bar{width:5px;border-radius:3px;align-self:stretch;}
  .msgout{white-space:pre-wrap;line-height:1.85;font-size:15px;}
  .ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px;text-align:center;padding:24px;}
  /* ボトムナビを4つ均等幅に */
  .v-bottom-navigation__content{justify-content:space-evenly !important;}
  .v-bottom-navigation__content > .v-btn{flex:1 1 0 !important;min-width:0 !important;max-width:none !important;}
  .v-bottom-navigation .v-btn__content{font-size:11px;white-space:nowrap;}
  /* カレンダー */
  .legend{width:15px;height:15px;border-radius:4px;display:inline-block;margin-right:5px;border:1px solid rgba(0,0,0,.12);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;}
  .cal-dow{margin-bottom:2px;}
  .cal-dowcell{text-align:center;font-size:13px;font-weight:700;padding:2px 0;}
  .cal-week{position:relative;}
  .cal-weekbg{display:grid;grid-template-columns:repeat(7,1fr);gap:0;}
  .cal-cell{min-height:66px;border:1px solid #ECEEF1;margin:-0.5px;padding:4px 5px;cursor:pointer;background:#fff;}
  .cal-empty{border:1px solid transparent;background:transparent;cursor:default;}
  .cal-cell:active{filter:brightness(.96);}
  .cal-today{box-shadow:inset 0 0 0 2px #06C755;}
  .cal-day{font-size:14px;font-weight:700;color:#1F2328;line-height:1.1;}
  .cal-sun{color:#DC2626 !important;}
  .cal-sat{color:#1565C0 !important;}
  .cal-seg{position:absolute;top:25px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 7px;overflow:hidden;cursor:pointer;}
  .cal-segname{font-size:11.5px;font-weight:700;color:#37474f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-conflict{box-shadow:inset 0 0 0 2px #DC2626;}
  .cal-air{background:#f7c9da;}
  .cal-book{background:#bfddf7;}
  .cal-priv{background:#bfe8ca;}
  .cal-stop{background:repeating-linear-gradient(45deg,#dfe4e7,#dfe4e7 6px,#cbd2d6 6px,#cbd2d6 12px);}
  /* PC表示：横に広がりすぎないよう中央寄せ＋最大幅、カレンダーのマスも少し高く
     （ダイアログはbody直下にテレポートされるので .v-main 配下だけ絞れば安全） */
  @media(min-width:960px){
    .v-main .v-container{max-width:880px;margin-left:auto;margin-right:auto;}
    .cal-cell{min-height:84px;}
    .cal-seg{top:27px;height:26px;}
    .cal-segname{font-size:12.5px;}
  }

  /* ── 収支（見やすさ最優先・帳場と同じ和紙/苔緑/朱の配色を移植） ── */
  .fin-period{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;}
  .fin-chip{border:1px solid #E3DCCF;background:#FFFDF9;color:#8A8577;font-size:13px;font-weight:700;
    padding:9px 18px;border-radius:22px;white-space:nowrap;flex:none;font-family:inherit;}
  .fin-chip.on{background:#3D4A35;border-color:#3D4A35;color:#F2EFE7;}
  .fin-nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 0 14px;}
  .fin-nav .lbl{font-size:16px;font-weight:800;color:#1F2328;min-width:110px;text-align:center;}
  .fin-range{display:flex;align-items:center;gap:8px;padding:0 0 14px;}

  .fin-card{background:#FFFDF9;border:1px solid #E3DCCF;border-radius:16px;margin-bottom:18px;overflow:hidden;}
  .fin-headline{padding:30px 20px 10px;text-align:center;position:relative;}
  .fin-headline::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:38px;height:3px;background:#A85542;border-radius:2px;}
  .fin-label{font-size:12px;letter-spacing:.12em;color:#A29B8A;font-weight:700;}
  .fin-num{font-family:"Shippori Mincho",serif;font-size:40px;color:#3D4A35;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;}
  .fin-num.minus{color:#A85542;}
  .fin-period-note{color:#8A8577;font-size:13px;margin-top:6px;}

  .fin-waterfall{padding:6px 20px 22px;}
  .fin-wf-row{display:flex;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #E3DCCF;font-size:15px;}
  .fin-wf-row:last-child{border-bottom:none;}
  .fin-wf-row .k{color:#8A8577;display:flex;align-items:center;gap:8px;}
  .fin-wf-row .k .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .fin-wf-row .v{font-variant-numeric:tabular-nums;font-weight:700;color:#1F2328;}
  .fin-wf-row.minus .v{color:#A85542;}
  .fin-wf-row.final{border-top:2px solid #1F2328;margin-top:4px;padding-top:16px;}
  .fin-wf-row.final .k{color:#1F2328;font-weight:800;font-size:15.5px;}
  .fin-wf-row.final .v{font-size:20px;color:#3D4A35;}

  .fin-chanwrap{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 20px;}
  .fin-chan-pill{background:#F8F4EC;border-radius:10px;padding:8px 13px;font-size:12.5px;color:#8A8577;}
  .fin-chan-pill b{color:#1F2328;font-size:13px;}

  .fin-chart-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 16px 0;}
  .fin-toggle{display:flex;background:#F1EDE3;border-radius:9px;padding:3px;gap:2px;}
  .fin-toggle button{border:none;background:transparent;font-size:12.5px;font-weight:700;color:#8A8577;
    padding:7px 13px;border-radius:7px;font-family:inherit;}
  .fin-toggle button.on{background:#FFFDF9;color:#1F2328;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .fin-chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding:26px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .fin-bar-wrap{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;height:100%;justify-content:flex-end;min-width:40px;}
  .fin-bar{width:30px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#D4B896,#3D4A35);transition:height .6s cubic-bezier(.22,.8,.3,1);}
  .fin-bar-wrap.neg .fin-bar{background:linear-gradient(180deg,#D9B3A8,#A85542);}
  .fin-bar-val{font-size:11px;font-weight:800;color:#1F2328;margin-bottom:6px;white-space:nowrap;}
  .fin-bar-label{font-size:11px;color:#8A8577;margin-top:9px;white-space:nowrap;}
  .fin-chart-empty{padding:36px;text-align:center;color:#A29B8A;font-size:13px;}
  .fin-occ-dot{width:20px;height:5px;border-radius:3px;margin-top:8px;background:#EDE6DB;border:1px solid #E3DCCF;}
  .fin-occ-dot.on{background:#3D4A35;border-color:#3D4A35;}
  .fin-legend{display:flex;align-items:center;gap:16px;padding:0 16px 16px;font-size:12px;color:#8A8577;}
  .fin-legend .sw{width:16px;height:5px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle;}

  .fin-total-row{display:flex;justify-content:space-between;padding:14px 16px;background:#F8F4EC;font-weight:800;}
  @keyframes finRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .fin-fadewrap>*{animation:finRise .45s cubic-bezier(.22,.8,.3,1) both;}
  .fin-fadewrap>*:nth-child(2){animation-delay:.06s;}
  .fin-fadewrap>*:nth-child(3){animation-delay:.12s;}
  .fin-fadewrap>*:nth-child(4){animation-delay:.18s;}
  .fin-fadewrap>*:nth-child(5){animation-delay:.24s;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.4/dist/vuetify.min.js"></script>
<script>
var LIFF_ID='2010467474-F0WkGdDW';
var API='https://script.google.com/macros/s/AKfycbya86LLxu2tq-8br3eWhjcyC0bd1yfkIPD7YR60fATxC1DX5k24xAI7Bs0cmDFNnOE6/exec';
var ID_TOKEN='';
var AUTH_PW='';   // PC・LINE外ブラウザ用：共有パスワード認証
function apiCall(action,params){params=params||{};
  var q='?action='+encodeURIComponent(action)+(AUTH_PW?('&pw='+encodeURIComponent(AUTH_PW)):('&idToken='+encodeURIComponent(ID_TOKEN)));
  Object.keys(params).forEach(function(k){q+='&'+k+'='+encodeURIComponent(params[k]);});
  return fetch(API+q).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'error');return j.data;});}
function p2(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addStr(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtMd(s){if(!s)return '';var p=String(s).split('-');return p.length===3?(+p[1])+'/'+(+p[2]):s;}
function fmtJaShort(s){if(!s)return '';var p=String(s).split('-');return p.length===3?(+p[1])+'月'+(+p[2])+'日':s;}
function fmtJa(s){if(!s)return '';var p=String(s).split('-');if(p.length!==3)return s;var wd=['日','月','火','水','木','金','土'];var dt=new Date(+p[0],+p[1]-1,+p[2]);return (+p[0])+'年'+(+p[1])+'月'+(+p[2])+'日（'+wd[dt.getDay()]+'）';}

var App={
  data:function(){return{
    ready:false, allowed:false, myId:'', err:'',
    mode:'', needPw:false, pwInput:'', pwErr:'',
    ver:'v31', tab:'today', loading:false, snack:false, snackText:'',
    today:null, res:[], tpl:[],
    detail:null, detailOpen:false, editOpen:false, edit:{}, delConfirm:false,
    add:{type:'予約',name:'',in:todayStr(),out:addStr(1),adults:'2',children:'0',amount:'',phone:'',email:'',notes:''},
    addOpen:false, addBusy:false,
    cal:(function(){var d=new Date();return {y:d.getFullYear(),m:d.getMonth()+1};})(),
    pick:{inOpen:false,outOpen:false,eInOpen:false,eOutOpen:false},
    msg:{uid:'',tpl:'',lang:'ja',code:''},
    fin:null, finMonth:(function(){var d=new Date();return d.getFullYear()+'-'+((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1);})(),
    finLoading:false, finRangeMode:'month', finYear:(new Date()).getFullYear(),
    finFrom:'', finTo:'', finGranChoice:'auto', finMetric:'gross',
    finCache:{}, finDisplayBalance:0, barsReady:false,
    exp:{date:todayStr(),category:'清掃',amount:'',memo:''},
    expOpen:false, expBusy:false,
    priceRules:[], priceRulesLoaded:false,
    prAdd:{target:'',content:'',memo:''}, prOpen:false, prBusy:false
  };},
  computed:{
    todoList:function(){
      var t=this.today||{};var out=[];
      (t.late||[]).forEach(function(x){out.push({uid:x.uid,title:x.task,sub:x.name,overdue:true,classify:false,done:false});});
      (t.todays||[]).forEach(function(x){out.push({uid:x.uid,title:x.task,sub:x.name,overdue:false,classify:false,done:!!x.done});});
      (t.needsType||[]).forEach(function(x){out.push({uid:x.uid,title:'種別を選ぶ（予約か売り止め）',sub:(x.name||'(名前未入力)')+'　'+x.in+'→'+x.out,overdue:false,classify:true,done:false});});
      return out;
    },
    calLabel:function(){return this.cal.y+'年 '+this.cal.m+'月';},
    calCells:function(){
      // 各夜を覆う予約を集める（泊数ベース：IN〜OUT前日。OUT当日は空き）
      var cover={};
      this.res.forEach(function(r){
        if(r.cancelled||!r.in||!r.out)return;
        var ip=String(r.in).split('-'),op=String(r.out).split('-');
        if(ip.length!==3||op.length!==3)return;
        var d=new Date(+ip[0],+ip[1]-1,+ip[2]),end=new Date(+op[0],+op[1]-1,+op[2]);
        var guard=0;
        while(d<end&&guard<400){var k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());(cover[k]=cover[k]||[]).push(r);d.setDate(d.getDate()+1);guard++;}
      });
      // 優先：実予約>売り止め。予約が2件以上重なったら本当の重複＝conflict
      var occ={};
      Object.keys(cover).forEach(function(k){
        var arr=cover[k];
        var bk=arr.filter(function(x){return x.type==='予約';});
        if(bk.length)occ[k]={r:bk[0],conflict:bk.length>1};
        else occ[k]={r:arr[0],conflict:false};
      });
      var first=new Date(this.cal.y,this.cal.m-1,1);
      var lead=first.getDay();
      var dim=new Date(this.cal.y,this.cal.m,0).getDate();
      var cells=[],i;
      for(i=0;i<lead;i++)cells.push(null);
      for(var day=1;day<=dim;day++){
        var k=this.cal.y+'-'+p2(this.cal.m)+'-'+p2(day);
        var o=occ[k]||null;
        cells.push({day:day,date:k,r:o?o.r:null,conflict:o?o.conflict:false,start:!!(o&&o.r.in===k),today:k===todayStr()});
      }
      return cells;
    },
    calWeeks:function(){
      // 帯は「IN日の午後〜OUT日の午前」の半日オフセット表示（チェックアウト日も見える）
      var arr=this.calCells.slice();
      while(arr.length%7)arr.push(null);
      var res=this.res;
      var weeks=[];
      for(var w=0;w<arr.length/7;w++){
        var days=arr.slice(w*7,w*7+7);
        var idx={},firstReal=-1,lastReal=-1;
        days.forEach(function(c,ci){if(c){idx[c.date]=ci;if(firstReal<0)firstReal=ci;lastReal=ci;}});
        var segs=[];
        if(firstReal>=0){
          var weekFirst=days[firstReal].date,weekLast=days[lastReal].date;
          res.forEach(function(r){
            if(r.cancelled||!r.in||!r.out)return;
            if(!/^\d{4}-\d{2}-\d{2}$/.test(String(r.in))||!/^\d{4}-\d{2}-\d{2}$/.test(String(r.out)))return;
            if(r.out<weekFirst||r.in>weekLast)return;
            var startsHere=(idx[r.in]!==undefined);
            var endsHere=(idx[r.out]!==undefined);
            var pos=startsHere?idx[r.in]+0.5:firstReal;
            var end=endsHere?idx[r.out]+0.5:lastReal+1;
            if(end-pos<=0.05)return;
            var conflict=false;
            for(var ci=firstReal;ci<=lastReal;ci++){
              var c=days[ci];if(!c)continue;
              if(c.date>=r.in&&c.date<r.out&&c.conflict){conflict=true;break;}
            }
            segs.push({pos:pos,len:end-pos,r:r,conflict:conflict,showName:startsHere||pos===firstReal});
          });
          segs.sort(function(a,b){return a.pos-b.pos;});
        }
        weeks.push({days:days,segs:segs});
      }
      return weeks;
    },
    upcoming:function(){var t=todayStr();return this.res.filter(function(r){return !r.cancelled&&r.out>=t;}).sort(function(a,b){return String(a.in).localeCompare(String(b.in));});},
    past:function(){var t=todayStr();return this.res.filter(function(r){return !r.cancelled&&r.out<t;}).sort(function(a,b){return String(b.in).localeCompare(String(a.in));}).slice(0,20);},
    needsReview:function(){return this.res.filter(function(r){return !r.cancelled&&!String(r.type||'').trim();}).sort(function(a,b){return String(a.in).localeCompare(String(b.in));});},
    bookings:function(){return this.res.filter(function(r){return !r.cancelled&&r.type==='予約';}).sort(function(a,b){return String(a.in).localeCompare(String(b.in));});},
    blocks:function(){return this.res.filter(function(r){return !r.cancelled&&(r.type==='売り止め'||r.type==='ブロック');}).sort(function(a,b){return String(a.in).localeCompare(String(b.in));});},
    msgGuests:function(){return this.res.filter(function(r){return !r.cancelled&&r.type!=='売り止め'&&r.type!=='ブロック';}).sort(function(a,b){return String(a.in).localeCompare(String(b.in));});},
    msgText:function(){
      if(!this.msg.uid||!this.msg.tpl)return 'お客さんと文例を選んでください';
      var r=this.findRes(this.msg.uid),t=this.tpl.filter(function(x){return x.name===this.msg.tpl;}.bind(this))[0];
      if(!r||!t)return '—';
      var body=(this.msg.lang==='en')?(t.en||''):(t.ja||'');var nm=r.name||'お客';var c=this.msg.code||'____';
      return body.replace(/\{お客さん名\}/g,nm).replace(/\{guest name\}/g,nm)
        .replace(/\{IN日\}/g,fmtJaShort(r.in)).replace(/\{check-in date\}/g,fmtMd(r.in))
        .replace(/\{OUT日\}/g,fmtJaShort(r.out)).replace(/\{check-out date\}/g,fmtMd(r.out))
        .replace(/\{暗証番号\}/g,c).replace(/\{door code\}/g,c);
    },
    finMonthLabel:function(){var p=this.finMonth.split('-');return p[0]+'年 '+(+p[1])+'月';},
    finRangeLabel:function(){
      if(!this.fin)return '';
      if(this.finRangeMode==='all')return '全期間';
      if(this.finRangeMode==='year')return this.finYear+'年';
      if(this.finRangeMode==='month')return this.finMonthLabel;
      if(this.fin.from&&this.fin.to)return this.fmtMd(this.fin.from)+' 〜 '+this.fmtMd(this.fin.to);
      return '';
    },
    finMax:function(){var s=this;if(!s.fin||!s.fin.series.length)return 1;var m=0;
      s.fin.series.forEach(function(pt){var v=Math.abs(pt[s.finMetric]||0);if(v>m)m=v;});return m||1;},
    finKey:function(){if(!this.fin)return '';return (this.fin.from||'all')+'_'+(this.fin.to||'')+'_'+this.fin.granularity+'_'+this.finMetric;}
  },
  watch:{ tab:function(v){ if(v==='today')this.loadToday(); else if(v==='list'||v==='msg'||v==='calendar')this.ensureRes(v); else if(v==='finance'&&!this.fin)this.loadFinance(); else if(v==='price'&&!this.priceRulesLoaded)this.loadPriceRules(); } },
  methods:{
    fmtMd:fmtMd, fmtJa:fmtJa, fmtJaShort:fmtJaShort,
    toast:function(m){this.snackText=m;this.snack=true;},
    chColor:function(r){if(r.type==='売り止め'||r.type==='ブロック')return 'grey';if(r.channel==='エアビー')return 'pink-darken-1';if(r.channel==='ブッキング')return 'blue-darken-2';return 'green-darken-1';},
    chLabel:function(r){if(r.type==='売り止め'||r.type==='ブロック')return '売り止め';if(r.channel==='エアビー')return 'Airbnb';if(r.channel==='ブッキング')return 'Booking';return '個人';},
    findRes:function(uid){return this.res.filter(function(r){return r.uid===uid;})[0];},
    loadToday:function(){var s=this;s.loading=true;apiCall('today',{}).then(function(d){s.today=d;s.loading=false;}).catch(function(e){s.loading=false;s.toast('エラー: '+e.message);});},
    ensureRes:function(which){var s=this;if(s.res.length){if(which==='msg'&&!s.tpl.length)s.loadTpl();return;}s.loading=true;
      var jobs=[apiCall('list',{})];if(which==='msg')jobs.push(apiCall('templates',{}));
      Promise.all(jobs).then(function(a){s.res=a[0].items||[];if(a[1])s.tpl=a[1].items||[];s.loading=false;}).catch(function(e){s.loading=false;s.toast('エラー: '+e.message);});},
    loadTpl:function(){var s=this;apiCall('templates',{}).then(function(d){s.tpl=d.items||[];});},
    refreshRes:function(cb){var s=this;apiCall('list',{}).then(function(d){s.res=d.items||[];if(cb)cb();});},
    toggleToday:function(t){var s=this;if(!t.uid){s.toast('更新できません');return;}var nv=!t.done;t.done=nv;s.toast(nv?'完了にしました':'戻しました');
      apiCall('toggleTask',{uid:t.uid,taskKey:t.col,value:nv}).then(function(){s.loadToday();}).catch(function(e){t.done=!nv;s.toast('エラー: '+e.message);});},
    channelName:function(c){if(c==='エアビー')return 'Airbnb';if(c==='ブッキング')return 'Booking';if(c==='手動')return '個人';return c||'';},
    calStep:function(n){var m=this.cal.m+n,y=this.cal.y;if(m<1){m=12;y--;}if(m>12){m=1;y++;}this.cal={y:y,m:m};},
    mediaClass:function(r){if(!r)return '';if(r.type==='売り止め'||r.type==='ブロック')return 'cal-stop';if(r.channel==='エアビー')return 'cal-air';if(r.channel==='ブッキング')return 'cal-book';return 'cal-priv';},
    dowColor:function(i){var d=i%7;return d===0?'cal-sun':(d===6?'cal-sat':'');},
    cellName:function(r){if(!r)return '';if(r.type==='売り止め'||r.type==='ブロック')return '売り止め';return (r.name&&r.name.trim())?r.name:this.chLabel(r);},
    segStyle:function(s){var L=s.pos/7*100,W=s.len/7*100;return {left:'calc('+L+'% + 2px)',width:'calc('+W+'% - 4px)'};},
    onDay:function(c){if(!c)return;if(c.r)this.openDetail(c.r.uid);else this.openAddFor(c.date);},
    openAddFor:function(date){this.add={type:'予約',name:'',in:date,out:this.addDays(date,1),adults:'2',children:'0',amount:'',phone:'',email:'',notes:''};this.addOpen=true;},
    addDays:function(s,n){var p=String(s).split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());},
    toDateObj:function(s){if(!s)return null;var p=String(s).split('-');if(p.length!==3)return null;return new Date(+p[0],+p[1]-1,+p[2]);},
    ymd:function(d){if(!d)return '';if(Array.isArray(d))d=d[0];return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());},
    onPickIn:function(d){var s=this.ymd(d);this.add.in=s;if(!this.add.out||this.add.out<=s)this.add.out=this.addDays(s,1);this.pick.inOpen=false;},
    onPickOut:function(d){this.add.out=this.ymd(d);this.pick.outOpen=false;},
    onPickEditIn:function(d){this.edit.in=this.ymd(d);this.pick.eInOpen=false;},
    onPickEditOut:function(d){this.edit.out=this.ymd(d);this.pick.eOutOpen=false;},
    openDetail:function(uid){var s=this;var r=s.findRes(uid);if(r){s.detail=r;s.detailOpen=true;return;}
      apiCall('list',{}).then(function(d){s.res=d.items||[];var r2=s.findRes(uid);if(r2){s.detail=r2;s.detailOpen=true;}else s.toast('見つかりません');});},
    detailTasks:function(r){var defs=[['予約お礼','予約お礼を送る'],['7日前','7日前メッセ'],['前日','前日メッセ（入り方）'],['宿泊お礼','宿泊お礼'],['清掃済','清掃']];
      return defs.map(function(d){return {col:d[0],label:d[1],done:!!(r.tasks&&r.tasks[d[0]])};});},
    toggleDetail:function(r,col){var s=this;var done=!!(r.tasks&&r.tasks[col]);if(r.tasks)r.tasks[col]=!done;
      apiCall('toggleTask',{uid:r.uid,taskKey:col,value:!done}).then(function(){}).catch(function(e){if(r.tasks)r.tasks[col]=done;s.toast('エラー: '+e.message);});},
    setType:function(uid,type){var s=this;var r=s.findRes(uid);var prev=r?r.type:'';
      if(r)r.type=type;s.toast(type+'にしました ✓');
      apiCall('update',{payload:JSON.stringify({uid:uid,patch:{'種別':type}})}).then(function(){s.refreshRes(function(){s.detail=s.findRes(uid);s.loadToday();});}).catch(function(e){if(r)r.type=prev;s.toast('保存に失敗: '+e.message);});},
    openEdit:function(){var r=this.detail;this.edit={uid:r.uid,type:r.type||'予約',name:r.name||'',in:r.in||'',out:r.out||'',adults:r.adults||'',amount:r.amount||'',phone:r.phone||'',email:r.email||'',lastContact:r.lastContact||'',notes:r.notes||''};this.editOpen=true;},
    saveEdit:function(){var s=this;var e=s.edit;
      // 楽観更新：先にUIへ反映して即閉じる → 裏で保存 → 失敗したら巻き戻して編集を再表示
      var r=s.findRes(e.uid);var prev=r?JSON.parse(JSON.stringify(r)):null;
      if(r){r.type=e.type;r.name=e.name;r.in=e.in;r.out=e.out;r.adults=e.adults;r.amount=e.amount;r.phone=e.phone;r.email=e.email;r.lastContact=e.lastContact;r.notes=e.notes;}
      s.editOpen=false;s.toast('保存しました ✓');
      var patch={'種別':e.type,'お客さん名':e.name,'IN':e.in,'OUT':e.out,'人数':e.adults,'金額':e.amount,'電話':e.phone,'メール':e.email,'最終やりとり日':e.lastContact,'メモ':e.notes};
      apiCall('update',{payload:JSON.stringify({uid:e.uid,patch:patch})}).then(function(){s.refreshRes(function(){s.detail=s.findRes(e.uid);s.loadToday();});}).catch(function(err){
        if(r&&prev)Object.keys(prev).forEach(function(k){r[k]=prev[k];});
        s.toast('保存に失敗しました: '+err.message);s.editOpen=true;});},
    cancelRes:function(){var s=this;var uid=s.detail.uid;s.delConfirm=false;
      var r=s.findRes(uid);if(r)r.cancelled=true;      // 楽観更新
      s.editOpen=false;s.detailOpen=false;s.toast('削除しました ✓');
      apiCall('update',{payload:JSON.stringify({uid:uid,patch:{'キャンセル':true}})}).then(function(){s.refreshRes();s.loadToday();}).catch(function(e){if(r)r.cancelled=false;s.toast('削除に失敗: '+e.message);});},
    submitAdd:function(){var s=this;var a=s.add;var stop=(a.type==='売り止め');
      if(!a.in||!a.out){s.toast('IN/OUTを入力してください');return;}
      if(!stop&&!a.name.trim()){s.toast('お客さん名を入力してください');return;}
      // 楽観更新：即閉じて裏で登録。失敗時は入力を保ったままダイアログ復帰
      s.addOpen=false;s.toast('登録中…');
      var payload={entry_type:a.type,check_in:a.in,check_out:a.out,guest_name:a.name,num_adults:a.adults,amount:a.amount,phone:a.phone,email:a.email,notes:a.notes,block_reason:a.notes};
      apiCall('add',{payload:JSON.stringify(payload)}).then(function(res){s.toast('登録しました ✓');
        s.refreshRes(function(){s.openDetail(res.uid);s.loadToday();});}).catch(function(e){s.toast('登録に失敗: '+e.message);s.addOpen=true;});},
    openMsgFor:function(uid){var s=this;s.tab='msg';s.msg.uid=uid;this.$nextTick(function(){s.ensureRes('msg');});this.detailOpen=false;},
    copyMsg:function(){var s=this;var txt=this.msgText;
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){s.toast('コピーしました ✓');},function(){s.fallbackCopy(txt);});}else s.fallbackCopy(txt);},
    fallbackCopy:function(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');this.toast('コピーしました ✓');}catch(e){this.toast('コピー失敗');}document.body.removeChild(ta);},
    // 収支タブは他タブと違いbootstrapに含めない（毎回の起動を遅くしないため）。
    // 起動直後に裏で1回だけ静かに取得しておき、実際にタブを開いた時は大抵キャッシュ済みにする。
    prefetchFinance_:function(){var s=this;if(s.tab==='finance')return;
      var rp=s.finRangeParams();var gran=s.finGranChoice;var key=rp.from+'|'+rp.to+'|'+gran;
      if(s.finCache[key])return;
      var params={};if(rp.from)params.from=rp.from;if(rp.to)params.to=rp.to;if(gran!=='auto')params.granularity=gran;
      apiCall('finance',params).then(function(d){s.finCache[key]=d;}).catch(function(){});},
    finRangeParams:function(){
      var mode=this.finRangeMode;
      if(mode==='month'){var p=this.finMonth.split('-');var last=new Date(+p[0],+p[1],0).getDate();return{from:this.finMonth+'-01',to:this.finMonth+'-'+(last<10?'0':'')+last};}
      if(mode==='year')return{from:this.finYear+'-01-01',to:this.finYear+'-12-31'};
      if(mode==='all')return{from:'',to:''};
      return{from:this.finFrom||'',to:this.finTo||''};
    },
    setFinMode:function(mode){this.finRangeMode=mode;
      if(mode==='month'){var d=new Date();this.finMonth=d.getFullYear()+'-'+((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1);}
      if(mode==='year')this.finYear=(new Date()).getFullYear();
      this.loadFinance();},
    setFinGran:function(g){this.finGranChoice=g;this.loadFinance();},
    loadFinance:function(){var s=this;var rp=s.finRangeParams();var gran=s.finGranChoice;
      var key=rp.from+'|'+rp.to+'|'+gran;
      if(s.finCache[key]){s.fin=s.finCache[key];s.animateFin_();}
      s.finLoading=true;
      var params={};if(rp.from)params.from=rp.from;if(rp.to)params.to=rp.to;if(gran!=='auto')params.granularity=gran;
      apiCall('finance',params).then(function(d){s.fin=d;s.finCache[key]=d;s.finLoading=false;s.animateFin_();})
        .catch(function(e){s.finLoading=false;if(!s.fin)s.toast('収支の読み込みに失敗: '+e.message);});},
    animateFin_:function(){var s=this;
      s._finAnimGen=(s._finAnimGen||0)+1;var myGen=s._finAnimGen;
      s.barsReady=false;s.$nextTick(function(){requestAnimationFrame(function(){if(myGen===s._finAnimGen)s.barsReady=true;});});
      if(!s.fin)return;var target=s.fin.balance,start=s.finDisplayBalance,t0=null,dur=650;
      function step(ts){if(myGen!==s._finAnimGen)return;if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1);var eased=1-Math.pow(1-p,3);
        s.finDisplayBalance=Math.round(start+(target-start)*eased);if(p<1)requestAnimationFrame(step);else s.finDisplayBalance=target;}
      requestAnimationFrame(step);},
    finStep:function(n){var p=this.finMonth.split('-');var y=+p[0],m=+p[1]+n;if(m<1){m=12;y--;}if(m>12){m=1;y++;}this.finMonth=y+'-'+(m<10?'0':'')+m;this.loadFinance();},
    finYearStep:function(n){this.finYear+=n;this.loadFinance();},
    fmtYenShort:function(n){n=Math.round(n||0);if(Math.abs(n)>=10000){var m=(n/10000);return (Math.round(m*10)/10)+'万';}return n.toLocaleString();},
    seriesLabel:function(period){var p=String(period).split('-');
      if(this.fin&&this.fin.granularity==='day')return (+p[1])+'/'+(+p[2]);
      return String(p[0]).slice(2)+'/'+(+p[1]);},
    barPct:function(pt){return Math.max(4,Math.abs(pt[this.finMetric]||0)/this.finMax*100);},
    openExpAdd:function(){this.exp={date:todayStr(),category:'清掃',amount:'',memo:''};this.expOpen=true;},
    submitExp:function(){var s=this;var e=s.exp;
      if(!e.date){s.toast('日付を入力してください');return;}
      if(!Number(e.amount)){s.toast('金額を入力してください');return;}
      s.expBusy=true;
      apiCall('addExpense',{payload:JSON.stringify(e)}).then(function(){s.expBusy=false;s.expOpen=false;s.toast('支出を登録しました ✓');s.loadFinance();})
        .catch(function(err){s.expBusy=false;s.toast('登録に失敗: '+err.message);});},

    // ── 料金ルール（値上げメモ＋Airbnb/Booking反映チェック） ──
    loadPriceRules:function(){var s=this;apiCall('listPriceRules').then(function(d){s.priceRules=d.items;s.priceRulesLoaded=true;}).catch(function(e){s.toast('料金ルールの読み込みに失敗: '+e.message);});},
    openPrAdd:function(){this.prAdd={target:'',content:'',memo:''};this.prOpen=true;},
    submitPr:function(){var s=this;var d=s.prAdd;
      if(!String(d.target||'').trim()){s.toast('対象を入力してください');return;}
      if(!String(d.content||'').trim()){s.toast('内容を入力してください');return;}
      s.prBusy=true;
      apiCall('addPriceRule',{payload:JSON.stringify(d)}).then(function(){s.prBusy=false;s.prOpen=false;s.toast('料金ルールを登録しました ✓');s.loadPriceRules();})
        .catch(function(err){s.prBusy=false;s.toast('登録に失敗: '+err.message);});},
    togglePrChannel:function(rule,which){var s=this;var col=which==='airbnb'?'Airbnb設定済み':'Booking設定済み';
      var newVal=!(which==='airbnb'?rule.airbnbSet:rule.bookingSet);var patch={};patch[col]=newVal;
      apiCall('updatePriceRule',{payload:JSON.stringify({uid:rule.uid,patch:patch})}).then(function(){
        if(which==='airbnb')rule.airbnbSet=newVal;else rule.bookingSet=newVal;
      }).catch(function(e){s.toast('更新に失敗: '+e.message);});},
    deletePr:function(uid){var s=this;apiCall('deletePriceRule',{uid:uid}).then(function(){s.toast('削除しました ✓');s.loadPriceRules();}).catch(function(e){s.toast('削除に失敗: '+e.message);});},
    deleteExp:function(uid){var s=this;apiCall('deleteExpense',{uid:uid}).then(function(){s.toast('削除しました ✓');s.loadFinance();}).catch(function(e){s.toast('削除に失敗: '+e.message);});},
    boot:function(){var s=this;
      var savedPw=(window.localStorage&&localStorage.getItem('kura_pw'))||'';
      function pwPath(){s.mode='pw';if(savedPw){AUTH_PW=savedPw;s.bootstrap();}else{s.ready=true;s.needPw=true;}}
      // LINEアプリ内ブラウザのUAには "Line/" が入る。無ければLIFF初期化を待たず即パスワード経路（PCの起動を速く）
      if(!/Line\//.test(navigator.userAgent)){ pwPath(); return; }
      try{
        liff.init({liffId:LIFF_ID}).then(function(){
          if(liff.isInClient()){                      // LINEアプリ内 → 従来どおりLINEログイン
            if(!liff.isLoggedIn()){liff.login();return;}
            ID_TOKEN=liff.getIDToken();s.mode='line';
            // 前回データを即表示（stale-while-revalidate）→ 裏で最新に差し替え
            var cache=null;try{cache=JSON.parse((window.localStorage&&localStorage.getItem('kura_cache'))||'null');}catch(e){}
            if(cache&&cache.res){s.today=cache.today||null;s.res=cache.res||[];s.tpl=cache.tpl||[];s.allowed=true;s.ready=true;if(s.tab==='today')s.loadToday();}
            s.bootstrap();
          }else{ pwPath(); }                           // 外部ブラウザ → パスワード
        }).catch(function(){ pwPath(); });             // LIFF不可でも入れる
      }catch(e){ pwPath(); }
    },
    bootstrap:function(){var s=this;s.loading=true;
      apiCall('bootstrap',{}).then(function(d){
        s.myId=(d.me&&d.me.userId)||'';s.allowed=!!(d.me&&d.me.allowed);s.ready=true;s.loading=false;s.needPw=false;
        if(s.allowed){s.today=d.today||null;s.res=(d.list&&d.list.items)||[];s.tpl=(d.templates&&d.templates.items)||[];
          try{if(window.localStorage)localStorage.setItem('kura_cache',JSON.stringify({t:Date.now(),today:s.today,res:s.res,tpl:s.tpl}));}catch(e){}
          s.prefetchFinance_();
        }else{try{if(window.localStorage)localStorage.removeItem('kura_cache');}catch(e){}}
      }).catch(function(e){s.loading=false;
        if(s.ready&&s.res.length){s.toast('更新に失敗しました（前回のデータを表示中）');return;} // キャッシュ表示中なら致命にしない
        s.ready=true;
        if(s.mode==='pw'){s.needPw=true;s.pwErr='パスワードが違うか、通信エラーです';AUTH_PW='';if(window.localStorage)localStorage.removeItem('kura_pw');}
        else{s.err=e.message;}
      });},
    submitPw:function(){var s=this;if(!s.pwInput){s.pwErr='パスワードを入力してください';return;}
      AUTH_PW=s.pwInput;s.pwErr='';s.needPw=false;if(window.localStorage)localStorage.setItem('kura_pw',s.pwInput);s.bootstrap();},
  },
  mounted:function(){this.boot();},
  template:'#tpl'
};

// テンプレート(#tpl)はこのスクリプトより後ろにあるので、DOM読み込み完了を待ってからmount
document.addEventListener('DOMContentLoaded', function(){
  var vuetify=Vuetify.createVuetify({
    locale:{ locale:'ja' },
    theme:{defaultTheme:'kura',themes:{kura:{dark:false,colors:{
      primary:'#06C755', secondary:'#05a948', surface:'#FFFFFF', background:'#F5F7F8',
      error:'#DC2626', warning:'#B7791F'
    }}}},
    defaults:{ VCard:{rounded:'lg', flat:true, border:true}, VBtn:{rounded:'lg'} }
  });
  Vue.createApp(App).use(vuetify).mount('#app');
});
</script>

<!-- Vue テンプレート -->
<script type="text/x-template" id="tpl">
<v-app>
  <!-- 未ログイン処理中 -->
  <div v-if="!ready" class="ctr">
    <v-progress-circular indeterminate color="primary" size="44"></v-progress-circular>
    <div style="color:#6B7280">読み込み中…</div>
  </div>

  <!-- パスワードログイン（PC・LINE外ブラウザ） -->
  <div v-else-if="needPw" class="ctr">
    <v-icon size="46" color="primary">mdi-lock-outline</v-icon>
    <div style="font-weight:700;font-size:18px">KURA 予約管理</div>
    <div style="color:#6B7280">パスワードを入力してください</div>
    <v-card class="pa-4" border flat style="width:100%;max-width:340px">
      <v-text-field v-model="pwInput" type="password" label="パスワード" variant="outlined" density="comfortable" hide-details="auto" :error-messages="pwErr" @keyup.enter="submitPw"></v-text-field>
      <v-btn color="primary" block size="large" class="mt-3" @click="submitPw">ログイン</v-btn>
    </v-card>
  </div>

  <!-- エラー -->
  <div v-else-if="err" class="ctr">
    <v-icon size="46" color="warning">mdi-alert-circle-outline</v-icon>
    <div style="color:#6B7280">{{ err }}</div>
    <v-btn color="primary" @click="boot">再読み込み</v-btn>
  </div>

  <!-- 未許可 -->
  <div v-else-if="!allowed" class="ctr">
    <v-icon size="46" color="primary">mdi-lock-outline</v-icon>
    <div style="font-weight:700;font-size:18px">登録が必要です</div>
    <div style="color:#6B7280">下のIDを森本さんに伝えてください</div>
    <v-card variant="tonal" color="primary" class="pa-4" style="word-break:break-all">
      <div style="font-size:12px;color:#6B7280">あなたのLINE ID</div>
      <div style="font-size:18px;font-weight:700">{{ myId }}</div>
    </v-card>
  </div>

  <!-- 本体 -->
  <template v-else>
    <v-app-bar flat border density="comfortable" style="background:#FFFFFF">
      <v-app-bar-title style="font-weight:700;color:#1F2328;letter-spacing:.02em">
        <span v-if="tab==='today'">今日のやること</span>
        <span v-else-if="tab==='list'">予約一覧</span>
        <span v-else-if="tab==='add'">予約を追加</span>
        <span v-else-if="tab==='finance'">収支</span>
        <span v-else-if="tab==='price'">料金ルール</span>
        <span v-else>メッセージ</span>
        <span class="text-caption text-disabled ml-2" style="font-weight:400">{{ ver }}</span>
      </v-app-bar-title>
      <v-btn v-if="tab==='today'" icon="mdi-refresh" variant="text" color="medium-emphasis" @click="loadToday"></v-btn>
    </v-app-bar>

    <v-main style="background:#FAFAFA">
      <v-progress-linear v-if="loading || finLoading" indeterminate color="primary"></v-progress-linear>
      <v-window v-model="tab" :touch="false">

        <!-- 今日 -->
        <v-window-item value="today">
          <v-container>
            <div v-if="today">
              <div style="font-size:20px;font-weight:700;margin:4px 4px 12px">{{ fmtJa(today.date) }}</div>

              <!-- 新規予約（24時間以内） -->
              <v-alert v-if="today.newRes && today.newRes.length" color="primary" variant="tonal" density="comfortable" class="mb-4" rounded="lg" icon="mdi-bell-ring-outline">
                <div class="font-weight-bold mb-1">新規予約がありました（{{ today.newRes.length }}件）</div>
                <div v-for="n in today.newRes" :key="n.uid" class="text-body-2 py-1" style="cursor:pointer" @click="openDetail(n.uid)">
                  ・{{ n.name }}　{{ n.in }}→{{ n.out }}（{{ channelName(n.channel) }}）
                </div>
              </v-alert>

              <div class="text-medium-emphasis text-caption font-weight-bold mb-2 ml-1" style="letter-spacing:.08em">今やること</div>
              <v-card v-if="!todoList.length"><v-card-text class="text-center text-medium-emphasis py-8">今やることはありません 🎉</v-card-text></v-card>
              <v-card v-else>
                <v-list lines="two" density="comfortable">
                  <template v-for="(t,i) in todoList" :key="i">
                    <v-list-item @click="openDetail(t.uid)">
                      <template #prepend>
                        <v-avatar :color="t.classify?'warning':(t.done?'primary':'grey-lighten-2')" size="36">
                          <v-icon color="white">{{ t.classify?'mdi-help':(t.done?'mdi-check':'mdi-circle-outline') }}</v-icon>
                        </v-avatar>
                      </template>
                      <v-list-item-title class="d-flex align-center" style="gap:6px;min-width:0">
                        <span class="text-truncate" :class="t.done?'text-decoration-line-through text-medium-emphasis':'font-weight-medium'">{{ t.title }}</span>
                        <v-chip v-if="t.overdue" size="x-small" color="error" variant="flat" class="flex-shrink-0">遅れ</v-chip>
                      </v-list-item-title>
                      <v-list-item-subtitle>{{ t.sub }}</v-list-item-subtitle>
                      <template #append><v-icon color="grey-lighten-1">mdi-chevron-right</v-icon></template>
                    </v-list-item>
                    <v-divider v-if="i<todoList.length-1"></v-divider>
                  </template>
                </v-list>
              </v-card>

              <div class="text-medium-emphasis text-caption font-weight-bold mb-2 ml-1 mt-5" style="letter-spacing:.08em">直近のイベント</div>
              <v-card elevation="1">
                <v-list density="comfortable">
                  <v-list-item>
                    <div class="text-caption text-medium-emphasis">今日チェックイン</div>
                    <div class="text-body-1 font-weight-bold">{{ today.todayIn.length?today.todayIn.join('、'):'なし' }}</div>
                  </v-list-item>
                  <v-divider></v-divider>
                  <v-list-item>
                    <div class="text-caption text-medium-emphasis">今日チェックアウト</div>
                    <div class="text-body-1 font-weight-bold">{{ today.todayOut.length?today.todayOut.join('、'):'なし' }}</div>
                  </v-list-item>
                  <v-divider></v-divider>
                  <v-list-item>
                    <div class="text-caption text-medium-emphasis">次のチェックイン</div>
                    <div class="text-body-1 font-weight-bold" style="white-space:normal">
                      <span v-if="today.nextIn">{{ today.nextIn.name }}<span class="text-medium-emphasis font-weight-regular text-body-2">　{{ today.nextIn.date }}（あと{{ today.nextIn.d }}日）</span></span>
                      <span v-else>予定なし</span>
                    </div>
                  </v-list-item>
                </v-list>
              </v-card>
            </div>
          </v-container>
        </v-window-item>

        <!-- 予約一覧 -->
        <v-window-item value="list">
          <v-container>
            <!-- 要確認アラート -->
            <v-alert v-if="needsReview.length" type="warning" variant="tonal" density="comfortable" class="mb-4" rounded="lg">
              <span class="font-weight-bold">{{ needsReview.length }}件</span>、種別が未設定です。タップして「予約」か「売り止め」を選んでください。
            </v-alert>

            <!-- 要確認 -->
            <template v-if="needsReview.length">
              <div class="text-warning text-caption font-weight-bold mb-2 ml-1" style="letter-spacing:.08em">要確認</div>
              <v-card class="mb-5" style="border-color:#E8C97A">
                <v-list>
                  <template v-for="(r,i) in needsReview" :key="r.uid">
                    <v-list-item @click="openDetail(r.uid)" style="background:#FFFBF0">
                      <template #prepend><v-icon color="warning">mdi-alert-circle-outline</v-icon></template>
                      <v-list-item-title class="font-weight-bold d-flex align-center" style="gap:6px">
                        <span>{{ fmtMd(r.in) }} → {{ fmtMd(r.out) }}</span>
                        <v-chip size="x-small" :color="chColor(r)" variant="flat" class="flex-shrink-0">{{ chLabel(r) }}</v-chip>
                      </v-list-item-title>
                      <v-list-item-subtitle>種別と名前を入れてください</v-list-item-subtitle>
                      <template #append><v-icon color="grey">mdi-chevron-right</v-icon></template>
                    </v-list-item>
                    <v-divider v-if="i<needsReview.length-1"></v-divider>
                  </template>
                </v-list>
              </v-card>
            </template>

            <!-- 予約 -->
            <div class="text-medium-emphasis text-caption font-weight-bold mb-2 ml-1" style="letter-spacing:.08em">予約</div>
            <v-card v-if="!bookings.length" class="mb-5"><v-card-text class="text-center text-medium-emphasis py-6">予約はありません</v-card-text></v-card>
            <v-card v-else class="mb-5"><v-list lines="two">
              <template v-for="(r,i) in bookings" :key="r.uid">
                <v-list-item @click="openDetail(r.uid)">
                  <template #prepend>
                    <v-avatar size="40" :color="chColor(r)" variant="tonal">
                      <span class="font-weight-bold">{{ (r.name||'?').slice(0,1) }}</span>
                    </v-avatar>
                  </template>
                  <v-list-item-title class="font-weight-bold d-flex align-center" style="gap:6px;min-width:0">
                    <span class="text-truncate">{{ r.name||'お名前未設定' }}</span>
                    <v-chip size="x-small" :color="chColor(r)" variant="flat" class="flex-shrink-0">{{ chLabel(r) }}</v-chip>
                    <v-chip v-if="r.isNew" size="x-small" color="error" variant="flat" class="flex-shrink-0">NEW</v-chip>
                  </v-list-item-title>
                  <v-list-item-subtitle class="mt-1">
                    <span class="text-body-2 text-high-emphasis">{{ fmtMd(r.in) }} → {{ fmtMd(r.out) }}</span>
                    <span class="text-medium-emphasis ml-3"><v-icon size="13" class="mr-1">mdi-bed-outline</v-icon>{{ r.nights }}泊</span>
                    <span v-if="r.adults" class="text-medium-emphasis ml-3"><v-icon size="13" class="mr-1">mdi-account-outline</v-icon>{{ r.adults }}名</span>
                  </v-list-item-subtitle>
                  <template #append><v-icon color="grey">mdi-chevron-right</v-icon></template>
                </v-list-item>
                <v-divider v-if="i<bookings.length-1"></v-divider>
              </template>
            </v-list></v-card>

            <!-- 売り止め -->
            <template v-if="blocks.length">
              <div class="text-medium-emphasis text-caption font-weight-bold mb-2 ml-1" style="letter-spacing:.08em">売り止め</div>
              <v-card><v-list bg-color="grey-lighten-4">
                <template v-for="(r,i) in blocks" :key="r.uid">
                  <v-list-item @click="openDetail(r.uid)">
                    <template #prepend><v-icon color="grey">mdi-cancel</v-icon></template>
                    <v-list-item-title class="text-medium-emphasis font-weight-medium">売り止め</v-list-item-title>
                    <v-list-item-subtitle>{{ fmtMd(r.in) }}→{{ fmtMd(r.out) }}<span v-if="r.notes">・{{ r.notes }}</span></v-list-item-subtitle>
                    <template #append><v-icon color="grey">mdi-chevron-right</v-icon></template>
                  </v-list-item>
                  <v-divider v-if="i<blocks.length-1"></v-divider>
                </template>
              </v-list></v-card>
            </template>
          </v-container>
        </v-window-item>

        <!-- カレンダー -->
        <v-window-item value="calendar">
          <v-container>
            <div class="d-flex align-center justify-space-between mb-3">
              <v-btn icon="mdi-chevron-left" variant="text" @click="calStep(-1)"></v-btn>
              <div class="text-h6 font-weight-bold">{{ calLabel }}</div>
              <v-btn icon="mdi-chevron-right" variant="text" @click="calStep(1)"></v-btn>
            </div>

            <div class="d-flex flex-wrap mb-3" style="gap:6px 14px">
              <span class="d-flex align-center text-caption"><span class="legend cal-air"></span>Airbnb</span>
              <span class="d-flex align-center text-caption"><span class="legend cal-book"></span>Booking</span>
              <span class="d-flex align-center text-caption"><span class="legend cal-priv"></span>個人</span>
              <span class="d-flex align-center text-caption"><span class="legend cal-stop"></span>売り止め</span>
            </div>

            <div class="cal-grid cal-dow">
              <div v-for="(w,i) in ['日','月','火','水','木','金','土']" :key="w" class="cal-dowcell" :class="i===0?'cal-sun':(i===6?'cal-sat':'text-medium-emphasis')">{{ w }}</div>
            </div>
            <div v-for="(wk,wi) in calWeeks" :key="wi" class="cal-week">
              <div class="cal-weekbg">
                <template v-for="(c,ci) in wk.days" :key="ci">
                  <div v-if="!c" class="cal-cell cal-empty"></div>
                  <div v-else class="cal-cell" :class="{'cal-today':c.today}" @click="onDay(c)">
                    <div class="cal-day" :class="dowColor(ci)">{{ c.day }}</div>
                  </div>
                </template>
              </div>
              <div v-for="(s,si) in wk.segs" :key="si" class="cal-seg" :class="[mediaClass(s.r),{'cal-conflict':s.conflict}]" :style="segStyle(s)" @click.stop="openDetail(s.r.uid)">
                <span v-if="s.showName" class="cal-segname">{{ cellName(s.r) }}</span>
              </div>
            </div>
            <div class="text-caption text-medium-emphasis text-center mt-4 mb-1">白い日（空き）をタップ → 予約・売り止めを登録</div>
            <div class="text-caption text-error text-center" v-if="calCells.some(function(c){return c&&c.conflict;})">⚠️ 赤枠は予約が重複しています。確認してください</div>
          </v-container>
        </v-window-item>

        <!-- メッセージ -->
        <v-window-item value="msg">
          <v-container>
            <v-card class="pa-4">
              <v-select v-model="msg.uid" :items="msgGuests.map(function(r){return {title:(r.name||'(名前未入力)')+'（'+fmtMd(r.in)+'）',value:r.uid};})" label="お客さん" variant="outlined" density="comfortable"></v-select>
              <v-select v-model="msg.tpl" :items="tpl.map(function(t){return t.name;})" label="文例" variant="outlined" density="comfortable"></v-select>
              <v-select v-model="msg.lang" :items="[{title:'日本語',value:'ja'},{title:'English',value:'en'}]" label="言語" variant="outlined" density="comfortable"></v-select>
              <v-text-field v-model="msg.code" label="暗証番号（前日メッセ用）" variant="outlined" density="comfortable"></v-text-field>
              <div class="text-caption text-medium-emphasis mt-2 mb-1">↓ 完成メッセージ</div>
              <v-sheet border rounded class="pa-4 msgout">{{ msgText }}</v-sheet>
              <v-btn color="primary" block size="large" class="mt-4" prepend-icon="mdi-content-copy" @click="copyMsg">コピーする</v-btn>
            </v-card>
          </v-container>
        </v-window-item>

        <!-- 収支 -->
        <v-window-item value="finance">
          <v-container>
            <div class="fin-period">
              <button class="fin-chip" :class="{on:finRangeMode==='month'}" @click="setFinMode('month')">今月</button>
              <button class="fin-chip" :class="{on:finRangeMode==='year'}" @click="setFinMode('year')">今年</button>
              <button class="fin-chip" :class="{on:finRangeMode==='all'}" @click="setFinMode('all')">全期間</button>
              <button class="fin-chip" :class="{on:finRangeMode==='custom'}" @click="setFinMode('custom')">期間を指定</button>
            </div>
            <div class="fin-nav" v-if="finRangeMode==='month'">
              <v-btn icon="mdi-chevron-left" variant="text" @click="finStep(-1)"></v-btn>
              <span class="lbl">{{ finMonthLabel }}</span>
              <v-btn icon="mdi-chevron-right" variant="text" @click="finStep(1)"></v-btn>
            </div>
            <div class="fin-nav" v-else-if="finRangeMode==='year'">
              <v-btn icon="mdi-chevron-left" variant="text" @click="finYearStep(-1)"></v-btn>
              <span class="lbl">{{ finYear }}年</span>
              <v-btn icon="mdi-chevron-right" variant="text" @click="finYearStep(1)"></v-btn>
            </div>
            <div class="fin-range" v-if="finRangeMode==='custom'">
              <v-text-field v-model="finFrom" type="date" label="開始日" variant="outlined" density="compact" hide-details @update:model-value="loadFinance"></v-text-field>
              <span style="color:#8A8577">〜</span>
              <v-text-field v-model="finTo" type="date" label="終了日" variant="outlined" density="compact" hide-details @update:model-value="loadFinance"></v-text-field>
            </div>

            <div v-if="finLoading && !fin" class="text-center text-medium-emphasis py-8">読み込み中…</div>

            <div v-if="fin" class="fin-fadewrap" :key="finKey">
              <div class="fin-card">
                <div class="fin-headline">
                  <div class="fin-label">この期間の収支</div>
                  <div class="fin-num" :class="{minus:fin.balance<0}">{{ fin.balance<0?'−':'' }}¥{{ Math.abs(finDisplayBalance).toLocaleString() }}</div>
                  <div class="fin-period-note">{{ finRangeLabel }}</div>
                </div>
                <div class="fin-waterfall">
                  <div class="fin-wf-row">
                    <span class="k"><span class="dot" style="background:#D4B896"></span>グロス（客の支払い合計）</span>
                    <span class="v">¥{{ fin.income.grossTotal.toLocaleString() }}</span>
                  </div>
                  <div class="fin-wf-row minus">
                    <span class="k"><span class="dot" style="background:#A85542"></span>OTA手数料</span>
                    <span class="v">−¥{{ fin.income.commissionTotal.toLocaleString() }}</span>
                  </div>
                  <div class="fin-wf-row minus">
                    <span class="k"><span class="dot" style="background:#A85542"></span>大家さんの取り分（30%）</span>
                    <span class="v">−¥{{ fin.income.landlordShareTotal.toLocaleString() }}</span>
                  </div>
                  <div class="fin-wf-row">
                    <span class="k"><span class="dot" style="background:#3D4A35"></span>手取り収入</span>
                    <span class="v">¥{{ fin.income.finalNetTotal.toLocaleString() }}</span>
                  </div>
                  <div class="fin-wf-row minus" v-if="fin.expense.total">
                    <span class="k"><span class="dot" style="background:#A85542"></span>支出</span>
                    <span class="v">−¥{{ fin.expense.total.toLocaleString() }}</span>
                  </div>
                  <div class="fin-wf-row final">
                    <span class="k">収支</span>
                    <span class="v">¥{{ fin.balance.toLocaleString() }}</span>
                  </div>
                </div>
                <div class="fin-chanwrap" v-if="Object.keys(fin.income.byChannel).length">
                  <div class="fin-chan-pill" v-for="(v,ch) in fin.income.byChannel" :key="ch"><b>{{ channelName(ch) }}</b> {{ v.count }}件・手取り¥{{ v.finalNet.toLocaleString() }}</div>
                </div>
              </div>

              <div class="fin-card">
                <div class="fin-chart-head">
                  <div class="fin-toggle">
                    <button :class="{on:finMetric==='gross'}" @click="finMetric='gross'">売上</button>
                    <button :class="{on:finMetric==='finalNet'}" @click="finMetric='finalNet'">手取り</button>
                  </div>
                  <div class="fin-toggle">
                    <button :class="{on:finGranChoice==='auto'}" @click="setFinGran('auto')">自動</button>
                    <button :class="{on:finGranChoice==='month'}" @click="setFinGran('month')">月次</button>
                    <button :class="{on:finGranChoice==='day'}" @click="setFinGran('day')">日次</button>
                  </div>
                </div>
                <div v-if="!fin.series.length" class="fin-chart-empty">この期間のデータはありません</div>
                <template v-else>
                  <div class="fin-chart">
                    <div class="fin-bar-wrap" v-for="pt in fin.series" :key="pt.period" :class="{neg: pt[finMetric]<0}">
                      <div class="fin-bar-val" v-if="pt[finMetric]">¥{{ fmtYenShort(pt[finMetric]) }}</div>
                      <div class="fin-bar" :style="{height: (barsReady?barPct(pt):0)+'%'}"></div>
                      <div v-if="fin.granularity==='day'" class="fin-occ-dot" :class="{on: pt.occupied}"></div>
                      <div class="fin-bar-label">{{ seriesLabel(pt.period) }}</div>
                    </div>
                  </div>
                  <div v-if="fin.granularity==='day'" class="fin-legend">
                    <span><span class="sw" style="background:#3D4A35"></span>在室中</span>
                    <span><span class="sw" style="background:#EDE6DB;border:1px solid #E3DCCF"></span>空き</span>
                  </div>
                </template>
              </div>

              <div class="text-medium-emphasis text-caption font-weight-bold mb-2 ml-1" style="letter-spacing:.08em">収入の内訳</div>
              <v-card v-if="!fin.income.items.length" class="mb-5"><v-card-text class="text-center text-medium-emphasis py-6">この期間の収入はありません</v-card-text></v-card>
              <v-card v-else class="mb-5">
                <v-list lines="two">
                  <template v-for="(it,i) in fin.income.items" :key="it.uid">
                    <v-list-item>
                      <template #prepend><v-chip size="x-small" :color="chColor(it)" variant="flat">{{ chLabel(it) }}</v-chip></template>
                      <v-list-item-title class="font-weight-bold ml-2 text-truncate" style="font-size:15px">{{ it.name||'お名前未設定' }}</v-list-item-title>
                      <v-list-item-subtitle class="ml-2">{{ fmtMd(it.in) }}→{{ fmtMd(it.out) }}　グロス¥{{ it.gross.toLocaleString() }}</v-list-item-subtitle>
                      <template #append>
                        <div class="text-right">
                          <div class="font-weight-bold" style="font-size:16px">¥{{ it.finalNet.toLocaleString() }}</div>
                          <div v-if="it.confirmed" class="text-caption text-success">確定</div>
                        </div>
                      </template>
                    </v-list-item>
                    <v-divider v-if="i<fin.income.items.length-1"></v-divider>
                  </template>
                </v-list>
                <v-divider></v-divider>
                <div class="fin-total-row"><span>合計</span><span>¥{{ fin.income.finalNetTotal.toLocaleString() }}</span></div>
              </v-card>

              <div class="d-flex align-center justify-space-between mb-2 ml-1">
                <div class="text-medium-emphasis text-caption font-weight-bold" style="letter-spacing:.08em">支出</div>
                <v-btn size="small" variant="text" color="primary" prepend-icon="mdi-plus" @click="openExpAdd">追加</v-btn>
              </div>
              <v-card v-if="!fin.expense.items.length" class="mb-5"><v-card-text class="text-center text-medium-emphasis py-6">この期間の支出はありません</v-card-text></v-card>
              <v-card v-else class="mb-5">
                <v-list>
                  <template v-for="(e,i) in fin.expense.items" :key="e.uid">
                    <v-list-item>
                      <v-list-item-title style="font-size:15px">{{ e.category }}<span class="text-medium-emphasis ml-2 text-body-2">{{ fmtMd(e.date) }}</span></v-list-item-title>
                      <v-list-item-subtitle v-if="e.memo">{{ e.memo }}</v-list-item-subtitle>
                      <template #append>
                        <span class="font-weight-bold mr-2" style="font-size:16px">¥{{ Number(e.amount).toLocaleString() }}</span>
                        <v-btn icon="mdi-close" size="x-small" variant="text" @click="deleteExp(e.uid)"></v-btn>
                      </template>
                    </v-list-item>
                    <v-divider v-if="i<fin.expense.items.length-1"></v-divider>
                  </template>
                </v-list>
                <v-divider></v-divider>
                <div class="fin-total-row"><span>合計</span><span>¥{{ fin.expense.total.toLocaleString() }}</span></div>
              </v-card>
            </div>
          </v-container>
        </v-window-item>

        <!-- 料金ルール -->
        <v-window-item value="price">
          <v-container>
            <div class="d-flex align-center justify-space-between mb-2 ml-1">
              <div class="text-medium-emphasis text-caption font-weight-bold" style="letter-spacing:.08em">料金ルール（値上げメモ）</div>
              <v-btn size="small" variant="text" color="primary" prepend-icon="mdi-plus" @click="openPrAdd">追加</v-btn>
            </div>
            <v-card v-if="!priceRules.length" class="mb-5"><v-card-text class="text-center text-medium-emphasis py-6">まだ記録はありません。祝日料金・特定日の値上げなどを決めたらここに記録してください</v-card-text></v-card>
            <v-card v-else class="mb-5">
              <v-list>
                <template v-for="(r,i) in priceRules" :key="r.uid">
                  <v-list-item>
                    <v-list-item-title style="font-size:15px">{{ r.target }}<span class="text-medium-emphasis ml-2 text-body-2">{{ r.content }}</span></v-list-item-title>
                    <v-list-item-subtitle v-if="r.memo">{{ r.memo }}</v-list-item-subtitle>
                    <div class="d-flex align-center mt-1" style="gap:6px">
                      <v-checkbox-btn density="compact" :model-value="r.airbnbSet" @update:model-value="togglePrChannel(r,'airbnb')" label="Airbnb"></v-checkbox-btn>
                      <v-checkbox-btn density="compact" :model-value="r.bookingSet" @update:model-value="togglePrChannel(r,'booking')" label="Booking"></v-checkbox-btn>
                    </div>
                    <template #append>
                      <v-btn icon="mdi-close" size="x-small" variant="text" @click="deletePr(r.uid)"></v-btn>
                    </template>
                  </v-list-item>
                  <v-divider v-if="i<priceRules.length-1"></v-divider>
                </template>
              </v-list>
            </v-card>
          </v-container>
        </v-window-item>

      </v-window>
    </v-main>

    <!-- 詳細ダイアログ（下からせり上がり） -->
    <v-dialog v-model="detailOpen" fullscreen transition="dialog-bottom-transition">
      <v-card v-if="detail" rounded="0" border="0">
        <v-toolbar flat border density="comfortable" style="background:#FFFFFF">
          <v-btn icon="mdi-chevron-down" variant="text" @click="detailOpen=false"></v-btn>
          <v-toolbar-title style="font-weight:700;color:#1F2328">{{ detail.name||'(名前未入力)' }}</v-toolbar-title>
          <v-btn variant="text" color="primary" @click="openEdit">編集</v-btn>
        </v-toolbar>
        <v-card-text style="background:#FAFAFA">
          <v-alert v-if="!String(detail.type||'').trim()" type="warning" variant="tonal" density="comfortable" class="mb-3" rounded="lg">
            <div class="mb-2 font-weight-bold">種別が未設定です</div>
            <div class="d-flex" style="gap:8px">
              <v-btn color="primary" variant="flat" size="small" @click="setType(detail.uid,'予約')">予約にする</v-btn>
              <v-btn variant="outlined" size="small" @click="setType(detail.uid,'売り止め')">売り止めにする</v-btn>
            </div>
          </v-alert>
          <v-chip :color="chColor(detail)" variant="flat" size="small" class="mb-3">{{ chLabel(detail) }}</v-chip>
          <v-card class="mb-4">
            <v-list density="comfortable" bg-color="transparent">
              <v-list-item title="日程" :subtitle="fmtMd(detail.in)+' → '+fmtMd(detail.out)+'（'+detail.nights+'泊）'"></v-list-item>
              <template v-if="detail.type!=='売り止め'">
                <v-list-item title="人数" :subtitle="(detail.adults||'-')+'名'"></v-list-item>
                <v-list-item title="金額" :subtitle="detail.amount?('¥'+Number(detail.amount).toLocaleString()):'-'"></v-list-item>
                <v-list-item v-if="detail.phone" title="電話" :subtitle="detail.phone"></v-list-item>
                <v-list-item v-if="detail.email" title="メール" :subtitle="detail.email"></v-list-item>
              </template>
              <v-list-item v-if="detail.lastContact" title="最終やりとり" :subtitle="detail.lastContact"></v-list-item>
            </v-list>
          </v-card>

          <template v-if="detail.type!=='売り止め'">
            <div class="text-medium-emphasis text-caption font-weight-bold mb-1">✅ やること</div>
            <v-card class="mb-4">
              <v-list>
                <v-list-item v-for="t in detailTasks(detail)" :key="t.col" @click="toggleDetail(detail,t.col)">
                  <template #prepend><v-checkbox-btn :model-value="t.done" color="primary"></v-checkbox-btn></template>
                  <v-list-item-title :class="t.done?'text-decoration-line-through text-medium-emphasis':''">{{ t.label }}</v-list-item-title>
                </v-list-item>
              </v-list>
            </v-card>

            <div class="text-medium-emphasis text-caption font-weight-bold mb-1">📝 メモ</div>
            <v-card class="mb-4"><v-card-text style="white-space:pre-wrap" :class="detail.notes?'':'text-medium-emphasis'">{{ detail.notes||'（メモなし）' }}</v-card-text></v-card>

            <div class="d-flex" style="gap:10px">
              <v-btn color="primary" variant="outlined" size="large" style="flex:1" prepend-icon="mdi-pencil" @click="openEdit">編集</v-btn>
              <v-btn color="primary" size="large" style="flex:1" prepend-icon="mdi-email-outline" @click="openMsgFor(detail.uid)">メッセージ</v-btn>
            </div>
          </template>
          <v-btn v-if="detail.type==='売り止め'" color="primary" variant="outlined" block size="large" prepend-icon="mdi-pencil" @click="openEdit">編集</v-btn>
        </v-card-text>
      </v-card>
    </v-dialog>

    <!-- 編集ダイアログ -->
    <v-dialog v-model="editOpen" fullscreen transition="dialog-bottom-transition">
      <v-card v-if="detail" rounded="0" border="0">
        <v-toolbar flat border density="comfortable" style="background:#FFFFFF">
          <v-btn icon="mdi-chevron-down" variant="text" @click="editOpen=false"></v-btn>
          <v-toolbar-title style="font-weight:700;color:#1F2328">編集</v-toolbar-title>
        </v-toolbar>
        <v-card-text style="background:#FAFAFA">
          <div class="text-caption text-medium-emphasis mb-1">種別</div>
          <v-btn-toggle v-model="edit.type" mandatory divided color="primary" class="mb-4" style="width:100%">
            <v-btn value="予約" style="flex:1">予約</v-btn>
            <v-btn value="売り止め" style="flex:1">売り止め</v-btn>
          </v-btn-toggle>
          <v-text-field v-model="edit.name" label="お客さん名" variant="outlined" density="comfortable"></v-text-field>
          <v-row dense>
            <v-col cols="6"><v-text-field :model-value="fmtJaShort(edit.in)" label="チェックイン" readonly variant="outlined" density="comfortable" prepend-inner-icon="mdi-calendar" @click="pick.eInOpen=true"></v-text-field></v-col>
            <v-col cols="6"><v-text-field :model-value="fmtJaShort(edit.out)" label="チェックアウト" readonly variant="outlined" density="comfortable" prepend-inner-icon="mdi-calendar" @click="pick.eOutOpen=true"></v-text-field></v-col>
          </v-row>
          <v-row dense>
            <v-col cols="6"><v-text-field v-model="edit.adults" label="人数" type="number" variant="outlined" density="comfortable"></v-text-field></v-col>
            <v-col cols="6"><v-text-field v-model="edit.amount" label="金額" type="number" variant="outlined" density="comfortable"></v-text-field></v-col>
          </v-row>
          <v-text-field v-model="edit.phone" label="電話" variant="outlined" density="comfortable"></v-text-field>
          <v-text-field v-model="edit.email" label="メール" variant="outlined" density="comfortable"></v-text-field>
          <v-text-field v-model="edit.lastContact" label="最終やりとり日 (YYYY-MM-DD)" variant="outlined" density="comfortable"></v-text-field>
          <v-textarea v-model="edit.notes" label="メモ" variant="outlined" rows="3"></v-textarea>
          <v-btn color="primary" block size="large" @click="saveEdit">保存</v-btn>
          <template v-if="detail.channel==='手動'">
            <v-btn color="error" variant="outlined" block size="large" class="mt-3" prepend-icon="mdi-trash-can-outline" @click="delConfirm=true">{{ edit.type==='売り止め'?'この売り止めを削除':'この予約を削除' }}</v-btn>
          </template>
          <v-alert v-else type="info" variant="tonal" density="comfortable" class="mt-3" rounded="lg">
            {{ chLabel(detail) }}の予約は、{{ chLabel(detail) }}側でキャンセルしてください。<br>キャンセルすると自動でここにも反映されます。
          </v-alert>
        </v-card-text>
      </v-card>
    </v-dialog>

    <!-- 削除確認 -->
    <v-dialog v-model="delConfirm" max-width="340">
      <v-card>
        <v-card-text class="pt-5 text-body-1">
          本当に削除しますか？<br>
          <span class="text-medium-emphasis text-body-2">手動の予約・売り止めが消え、Airbnb / Booking のブロックも自動で解除されます。</span>
        </v-card-text>
        <v-card-actions class="px-4 pb-4">
          <v-btn variant="text" @click="delConfirm=false">やめる</v-btn>
          <v-spacer></v-spacer>
          <v-btn color="error" variant="flat" @click="cancelRes">削除する</v-btn>
        </v-card-actions>
      </v-card>
    </v-dialog>

    <!-- 新規登録ダイアログ（カレンダーの空き日タップから） -->
    <v-dialog v-model="addOpen" fullscreen transition="dialog-bottom-transition">
      <v-card rounded="0" border="0">
        <v-toolbar flat border density="comfortable" style="background:#FFFFFF">
          <v-btn icon="mdi-chevron-down" variant="text" @click="addOpen=false"></v-btn>
          <v-toolbar-title style="font-weight:700;color:#1F2328">新規登録</v-toolbar-title>
        </v-toolbar>
        <v-card-text style="background:#FAFAFA">
          <div class="text-caption text-medium-emphasis mb-1">種別</div>
          <v-btn-toggle v-model="add.type" mandatory divided color="primary" class="mb-4" style="width:100%">
            <v-btn value="予約" style="flex:1">お客さんの予約</v-btn>
            <v-btn value="売り止め" style="flex:1">売り止め</v-btn>
          </v-btn-toggle>
          <v-text-field v-if="add.type==='予約'" v-model="add.name" label="お客さん名 *" variant="outlined" density="comfortable"></v-text-field>
          <v-row dense>
            <v-col cols="6"><v-text-field :model-value="fmtJaShort(add.in)" label="チェックイン" readonly variant="outlined" density="comfortable" prepend-inner-icon="mdi-calendar" @click="pick.inOpen=true"></v-text-field></v-col>
            <v-col cols="6"><v-text-field :model-value="fmtJaShort(add.out)" label="チェックアウト" readonly variant="outlined" density="comfortable" prepend-inner-icon="mdi-calendar" @click="pick.outOpen=true"></v-text-field></v-col>
          </v-row>
          <template v-if="add.type==='予約'">
            <v-row dense>
              <v-col cols="6"><v-text-field v-model="add.adults" label="大人 *" type="number" variant="outlined" density="comfortable"></v-text-field></v-col>
              <v-col cols="6"><v-text-field v-model="add.amount" label="金額" type="number" variant="outlined" density="comfortable"></v-text-field></v-col>
            </v-row>
            <v-text-field v-model="add.phone" label="電話" variant="outlined" density="comfortable"></v-text-field>
            <v-text-field v-model="add.email" label="メール" variant="outlined" density="comfortable"></v-text-field>
          </template>
          <v-textarea v-model="add.notes" :label="add.type==='売り止め'?'メモ（理由）':'メモ'" variant="outlined" rows="3"></v-textarea>
          <v-btn color="primary" block size="large" :loading="addBusy" @click="submitAdd">登録する</v-btn>
        </v-card-text>
      </v-card>
    </v-dialog>

    <!-- 支出を追加 -->
    <v-dialog v-model="expOpen" fullscreen transition="dialog-bottom-transition">
      <v-card rounded="0" border="0">
        <v-toolbar flat border density="comfortable" style="background:#FFFFFF">
          <v-btn icon="mdi-chevron-down" variant="text" @click="expOpen=false"></v-btn>
          <v-toolbar-title style="font-weight:700;color:#1F2328">支出を追加</v-toolbar-title>
        </v-toolbar>
        <v-card-text style="background:#FAFAFA">
          <v-text-field v-model="exp.date" label="日付" type="date" variant="outlined" density="comfortable"></v-text-field>
          <v-select v-model="exp.category" :items="['清掃','消耗品','印刷','会費','その他']" label="カテゴリ" variant="outlined" density="comfortable"></v-select>
          <v-text-field v-model="exp.amount" label="金額" type="number" variant="outlined" density="comfortable"></v-text-field>
          <v-text-field v-model="exp.memo" label="メモ" variant="outlined" density="comfortable"></v-text-field>
          <v-btn color="primary" block size="large" :loading="expBusy" @click="submitExp">登録する</v-btn>
        </v-card-text>
      </v-card>
    </v-dialog>

    <!-- 料金ルールを追加 -->
    <v-dialog v-model="prOpen" fullscreen transition="dialog-bottom-transition">
      <v-card rounded="0" border="0">
        <v-toolbar flat border density="comfortable" style="background:#FFFFFF">
          <v-btn icon="mdi-chevron-down" variant="text" @click="prOpen=false"></v-btn>
          <v-toolbar-title style="font-weight:700;color:#1F2328">料金ルールを追加</v-toolbar-title>
        </v-toolbar>
        <v-card-text style="background:#FAFAFA">
          <v-text-field v-model="prAdd.target" label="対象（例：祝日全般／お盆 8/13〜16）" variant="outlined" density="comfortable"></v-text-field>
          <v-text-field v-model="prAdd.content" label="内容（例：¥18,000に値上げ／+20%）" variant="outlined" density="comfortable"></v-text-field>
          <v-text-field v-model="prAdd.memo" label="メモ（任意）" variant="outlined" density="comfortable"></v-text-field>
          <v-btn color="primary" block size="large" :loading="prBusy" @click="submitPr">登録する</v-btn>
        </v-card-text>
      </v-card>
    </v-dialog>

    <!-- 日付ピッカー（共通） -->
    <v-dialog v-model="pick.inOpen" width="auto"><v-date-picker :model-value="toDateObj(add.in)" @update:model-value="onPickIn" color="primary" title="チェックイン" show-adjacent-months></v-date-picker></v-dialog>
    <v-dialog v-model="pick.outOpen" width="auto"><v-date-picker :model-value="toDateObj(add.out)" @update:model-value="onPickOut" color="primary" title="チェックアウト" show-adjacent-months></v-date-picker></v-dialog>
    <v-dialog v-model="pick.eInOpen" width="auto"><v-date-picker :model-value="toDateObj(edit.in)" @update:model-value="onPickEditIn" color="primary" title="チェックイン" show-adjacent-months></v-date-picker></v-dialog>
    <v-dialog v-model="pick.eOutOpen" width="auto"><v-date-picker :model-value="toDateObj(edit.out)" @update:model-value="onPickEditOut" color="primary" title="チェックアウト" show-adjacent-months></v-date-picker></v-dialog>

    <!-- ボトムナビ -->
    <v-bottom-navigation v-model="tab" color="primary" grow :elevation="0" bg-color="surface" style="border-top:1px solid #ECEEF1">
      <v-btn value="today"><v-icon>mdi-star-outline</v-icon>今日</v-btn>
      <v-btn value="list"><v-icon>mdi-format-list-bulleted</v-icon>予約</v-btn>
      <v-btn value="calendar"><v-icon>mdi-calendar-month-outline</v-icon>カレンダー</v-btn>
      <v-btn value="msg"><v-icon>mdi-email-outline</v-icon>メッセ</v-btn>
      <v-btn value="finance"><v-icon>mdi-cash-multiple</v-icon>収支</v-btn>
      <v-btn value="price"><v-icon>mdi-tag-multiple-outline</v-icon>料金</v-btn>
    </v-bottom-navigation>

    <v-snackbar v-model="snack" timeout="2000" location="bottom">{{ snackText }}</v-snackbar>
  </template>
</v-app>
</script>
</body>
</html>
